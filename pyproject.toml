[project]
name = "trafficlab"
version = "0.1.0"
description = "Research prototype for fitting and comparing network traffic models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    # Runtime dependencies directly own validated artifacts, deterministic
    # numerical work, packet I/O, and TOML serialization.
    "pydantic>=2.11,<3",
    "scapy==2.7.0",
    "scipy>=1.16,<2",
    "tomli-w>=1.2,<2",
]

[project.optional-dependencies]
dashboard = [
    "matplotlib>=3.10,<4",
    "pyside6>=6.8,<7",
]

[project.urls]
Repository = "https://github.com/borodin-devel/trafficlab"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# Development tools stay outside the production dependency set so capture and
# fitting installations do not acquire test runners or static analyzers.
dev = [
    "hypothesis>=6,<7",
    "jsonschema>=4,<5",
    "pymoo==0.6.2",
    "pyright",
    "pytest",
    "pytest-cov",
    "pytest-qt>=4.4,<5",
    "pytest-xdist",
    "ruff",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
# External capabilities are explicit markers: the ordinary suite is offline,
# while Docker and Internet tests require deliberate bounded invocations.
markers = [
    "integration: joins multiple Trafficlab modules without external services",
    "docker: requires Docker Engine and Docker Compose",
    "internet: uses a configurable public Internet endpoint",
]

[tool.coverage.run]
# Branch coverage is the project gate because validation and cleanup behavior
# depends as much on failure paths as on successful statements.
branch = true
source = ["trafficlab", "trafficlab_dashboard"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[project.scripts]
trafficlab = "trafficlab.cli:entrypoint"
trafficlab-dashboard = "trafficlab_dashboard.app:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pyright]
# Strict checking covers both public implementation contracts and the tests
# that construct or mutate those contracts directly.
include = ["src/trafficlab", "src/trafficlab_dashboard", "tests", "tests/trafficlab_dashboard"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.hatch.build.targets.wheel]
packages = ["src/trafficlab", "src/trafficlab_dashboard"]
