upper = 0.45

[models.markov_renewal.q2]
lower = 0.55
upper = 0.9

[models.markov_renewal.alpha]
lower = 0.05
upper = 1.5

[models.markov_renewal.r]
lower = 1
upper = 4

[models.markov_renewal.c_t]
lower = 0.5
upper = 1.5

[models.mmpp]
crossover_probability = 0.45
mutation_probability = 0.0
