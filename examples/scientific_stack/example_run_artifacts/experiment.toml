[run]
directory = "/tmp/trafficlab-example-record.EuvjV6/repo/runs/scientific-stack"
minimum_free_bytes = 1048576
master_seed = 20260819
final_seed = 97

[target]
image = "curlimages/curl@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b"
argv = [
    "--fail",
    "--silent",
    "--show-error",
    "--location",
    "--max-redirs",
    "3",
    "--proto",
    "=https",
    "--proto-redir",
    "=https",
    "--http1.1",
    "--connect-timeout",
    "15",
    "--max-time",
    "30",
    "--limit-rate",
    "512K",
    "--range",
    "0-65535",
    "--max-filesize",
    "65536",
    "--output",
    "/dev/null",
    "--url",
    "https://upload.wikimedia.org/wikipedia/commons/5/5b/SPACE_ELECTRIC_ROCKET_TEST%2C_SERT_II_IN_TANK_5_%28GRC-1968-C-03031%29.jpg",
]
working_directory = "/"
mounts = []

[target.environment]

[capture]
image = "trafficlab-capture:local"
network_probe_url = "https://upload.wikimedia.org/wikipedia/commons/5/5b/SPACE_ELECTRIC_ROCKET_TEST%2C_SERT_II_IN_TANK_5_%28GRC-1968-C-03031%29.jpg"
readiness_timeout_seconds = 10.0
workload_timeout_seconds = 35.0
flush_timeout_seconds = 5.0
total_timeout_seconds = 90.0

[generation.trial]
max_packets = 2000
max_output_bytes = 4000000
max_wall_seconds = 3.0

[generation.final]
max_packets = 5000
max_output_bytes = 10000000
max_wall_seconds = 5.0

[genetic]
population_size = 6
generation_count = 1
tournament_size = 2
elite_count = 1
