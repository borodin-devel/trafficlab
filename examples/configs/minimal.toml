[run]
# Relative paths are resolved from this configuration file's directory.  This
# keeps generated state under the repository's ignored ``runs/`` tree.
directory = "../../runs/minimal"
minimum_free_bytes = 1048576
# The master seed drives model search and trials; the separate final seed is
# reserved for generating the selected model's final trace.
master_seed = 12345
final_seed = 54321

[target]
# ``example.invalid`` prevents accidental live traffic.  Replace the image and
# argv together when turning this validation example into an actual capture.
image = "curlimages/curl:8.10.1"
argv = ["https://example.invalid/data"]
working_directory = "/work"

[target.environment]
LANG = "C"

[[target.mounts]]
# The example data directory is mounted read-only so the target cannot mutate
# source-controlled inputs while it runs.
source = "../data"
target = "/work/data"
read_only = true

[capture]
image = "trafficlab-capture:local"
network_probe_url = "https://example.invalid/"
# Component timeouts diagnose readiness, workload, and flush failures; the
# total timeout is an independent upper bound for the entire capture lifecycle.
readiness_timeout_seconds = 10.0
workload_timeout_seconds = 30.0
flush_timeout_seconds = 5.0
total_timeout_seconds = 60.0

[generation.trial]
# Trial traces are deliberately cheap because the genetic search evaluates many
# candidates.  Final generation receives larger packet, byte, and time budgets.
max_packets = 2000
max_output_bytes = 4000000
max_wall_seconds = 5.0

[generation.final]
max_packets = 20000
max_output_bytes = 40000000
max_wall_seconds = 30.0

[genetic]
# Every enabled family uses the same population and seed schedule.  Zero early
# stopping generations disables that shortcut, and resume=false starts without
# accepting a prior checkpoint.
population_size = 9
generation_count = 3
tournament_size = 3
elite_count = 1
trial_seeds = [101, 102]
duplicate_mutation_attempts = 3
early_stopping_generations = 0
resume = false

[models]
# Each classical family is fitted independently before similarity selects the
# best retained candidate.
enabled = ["poisson_empirical", "markov_renewal", "mmpp"]

[models.poisson_empirical]
crossover_probability = 0.9
mutation_probability = 1.0
mutation_scale = 0.1

[models.poisson_empirical.c_lambda]
lower = 0.25
upper = 4.0

[models.markov_renewal]
crossover_probability = 0.9
mutation_probability = 0.2
mutation_scale = 0.1

[models.markov_renewal.q1]
lower = 0.1
upper = 0.4

[models.markov_renewal.q2]
lower = 0.6
upper = 0.9

[models.markov_renewal.alpha]
lower = 0.0
upper = 2.0

[models.markov_renewal.r]
lower = 1
upper = 8

[models.markov_renewal.c_t]
lower = 0.25
upper = 4.0

[models.mmpp]
crossover_probability = 0.9
mutation_probability = 0.25
mutation_scale = 0.1

[models.mmpp.q01]
lower = 0.01
upper = 10.0

[models.mmpp.q10]
lower = 0.01
upper = 10.0

[models.mmpp.lambda0]
lower = 0.01
upper = 100.0

[models.mmpp.lambda1]
lower = 0.1
upper = 1000.0

[similarity]
# Scale and feature weights are normalized independently.  The cell cap bounds
# both traffic directions across all configured widths before allocation.
iat_diagnostic_quantile = 0.95
acf_lags = [1]
acf_lag_weights = [1.0]
acf_iat_weight = 0.5
acf_size_weight = 0.5
multiscale_widths_seconds = [0.1, 1.0]
multiscale_scale_weights = [0.5, 0.5]
multiscale_packet_weight = 0.5
multiscale_byte_weight = 0.5
max_direction_bin_cells = 100000

[similarity.method_weights]
# These four weights must sum to one; each mandatory method contributes equally
# to the aggregate score in this minimal example.
frame_size_ks = 0.25
iat_ks = 0.25
autocorrelation = 0.25
multiscale_rate = 0.25
