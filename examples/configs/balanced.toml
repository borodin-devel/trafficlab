# Balanced search profile for importing external references from dumps/.
# This has the same scientific and safety settings as default.toml.
#
# Copy this file for every experiment and change [run].directory to a fresh,
# unique path, then run `trafficlab import-run EXPERIMENT DUMP_DIRECTORY`.
# The manual `preflight --config-only`, pair copy, `fit`, `generate`, and
# `compare` sequence is only for advanced diagnosis or resume.  Do not use
# `capture` or `run`: the target and capture values below are deliberately
# non-runnable provenance placeholders.

[run]
directory = "../../runs/balanced"
# Covers the largest checked local dump, a generated trace up to the final
# guard, checkpoints, histories, temporary siblings, and ordinary filesystem
# overhead.  Increase this for larger future inputs.
minimum_free_bytes = 10_737_418_240
master_seed = 20260831
# Final generation must use a seed distinct from every selection trial seed.
final_seed = 20260832

[target]
# These values honestly record that no workload was executed for an imported
# reference.  Full Docker preflight, capture, and `trafficlab run` are expected
# to fail until replaced by a real pinned target and direct argv.
image = "invalid@@external-reference"
argv = ["external-reference-not-executed"]
working_directory = "/"

[target.environment]

[capture]
image = "invalid@@external-reference"
network_probe_url = "https://example.invalid/"
readiness_timeout_seconds = 10.0
workload_timeout_seconds = 3600.0
flush_timeout_seconds = 30.0
total_timeout_seconds = 3700.0

[generation.trial]
# Trial simulations still cover the reference's complete W.  These guards
# accommodate every capture currently prepared under dumps/, including the
# 183,633-packet, approximately 342 MB full-workflow trace.  Guard exhaustion
# remains an invalid candidate rather than a partial scientific result.
max_packets = 1_000_000
max_output_bytes = 2_000_000_000
max_wall_seconds = 60.0

[generation.final]
max_packets = 2_000_000
max_output_bytes = 4_000_000_000
max_wall_seconds = 300.0

[genetic]
# Twenty-eight individuals give each of the seven families four initial lanes.
# Fifty generations and three common simulation seeds permit at most 4,284
# full-window selection simulations; fit adds one final validation.  Resume
# preserves every whole-generation checkpoint.  Early stopping requires 12
# consecutive generations without an absolute best-fitness improvement greater
# than 0.0001.
population_size = 28
generation_count = 50
tournament_size = 5
elite_count = 2
trial_seeds = [17, 29, 43]
duplicate_mutation_attempts = 10
early_stopping_generations = 12
early_stopping_tolerance = 0.0001
resume = true

[models]
enabled = ["poisson_empirical", "markov_renewal", "mmpp", "nhpp", "acd", "markov_packet_train", "packet_hmm"]

[models.poisson_empirical]
crossover_probability = 0.9
mutation_probability = 1.0
mutation_scale = 0.1

[models.poisson_empirical.c_lambda]
lower = 0.25
upper = 4.0

[models.markov_renewal]
crossover_probability = 0.9
mutation_probability = 0.2
mutation_scale = 0.1

[models.markov_renewal.q1]
lower = 0.1
upper = 0.4

[models.markov_renewal.q2]
lower = 0.6
upper = 0.9

[models.markov_renewal.alpha]
lower = 0.0
upper = 2.0

[models.markov_renewal.r]
lower = 1
upper = 8

[models.markov_renewal.c_t]
lower = 0.25
upper = 4.0

[models.mmpp]
crossover_probability = 0.9
mutation_probability = 0.25
mutation_scale = 0.1

[models.mmpp.q01]
lower = 0.01
upper = 10.0

[models.mmpp.q10]
lower = 0.01
upper = 10.0

[models.mmpp.lambda0]
lower = 0.01
upper = 100.0

[models.mmpp.lambda1]
lower = 0.1
upper = 1000.0

[models.nhpp]
crossover_probability = 0.9
mutation_probability = 1.0
mutation_scale = 0.1

[models.nhpp.bin_count]
lower = 2
upper = 16

[models.acd]
crossover_probability = 0.9
mutation_probability = 1.0
mutation_scale = 0.1

[models.acd.order]
lower = 1
upper = 3

[models.markov_packet_train]
crossover_probability = 0.9
mutation_probability = 1.0
mutation_scale = 0.1

[models.markov_packet_train.length_cap]
lower = 3
upper = 8

[models.packet_hmm]
crossover_probability = 0.9
mutation_probability = 1.0
mutation_scale = 0.1

[models.packet_hmm.state_count]
lower = 2
upper = 4

[similarity]
# These validated scales remain below the configured direction-cell cap for
# the longest current dump.  Every method runs even when its weight is zero.
iat_diagnostic_quantile = 0.95
acf_lags = [1]
acf_lag_weights = [1.0]
acf_iat_weight = 0.5
acf_size_weight = 0.5
multiscale_widths_seconds = [0.25, 1.0]
multiscale_scale_weights = [0.5, 0.5]
multiscale_packet_weight = 0.5
multiscale_byte_weight = 0.5
max_direction_bin_cells = 100_000
cvm_iat_weight = 0.5
cvm_size_weight = 0.5
cvm_global_weight = 0.5
cvm_uplink_weight = 0.25
cvm_downlink_weight = 0.25
ad_iat_weight = 0.5
ad_size_weight = 0.5
ad_global_weight = 0.5
ad_uplink_weight = 0.25
ad_downlink_weight = 0.25
js_iat_bin_count = 32
js_iat_weight = 0.5
js_mark_weight = 0.5
mmd_feature_count = 256
mmd_seed = 7305
