[run]
directory = "."
minimum_free_bytes = 1
master_seed = 73
final_seed = 97

[target]
image = "trafficlab-offline-fixture:local"
argv = [
    "fixture-only",
]
working_directory = "/work"
mounts = []

[target.environment]

[capture]
image = "trafficlab-capture:local"
network_probe_url = "https://example.invalid/"
readiness_timeout_seconds = 2.0
workload_timeout_seconds = 5.0
flush_timeout_seconds = 2.0
total_timeout_seconds = 10.0

[generation.trial]
max_packets = 500
max_output_bytes = 1000000
max_wall_seconds = 5.0

[generation.final]
max_packets = 1000
max_output_bytes = 2000000
max_wall_seconds = 10.0

[genetic]
population_size = 8
generation_count = 1
tournament_size = 2
elite_count = 1
trial_seeds = [
    17,
]
duplicate_mutation_attempts = 1
early_stopping_generations = 0
early_stopping_tolerance = 0.0
resume = true

[models]
enabled = [
    "poisson_empirical",
    "markov_renewal",
    "mmpp",
    "nhpp",
    "acd",
    "markov_packet_train",
    "packet_hmm",
]

[models.poisson_empirical]
crossover_probability = 0.35
mutation_probability = 0.0
mutation_scale = 0.07

[models.poisson_empirical.c_lambda]
lower = 0.5
upper = 1.5

[models.markov_renewal]
crossover_probability = 1.0
mutation_probability = 0.0
mutation_scale = 0.06

[models.markov_renewal.q1]
lower = 0.15
upper = 0.45

[models.markov_renewal.q2]
lower = 0.55
upper = 0.9

[models.markov_renewal.alpha]
lower = 0.05
upper = 1.5

[models.markov_renewal.r]
lower = 1
upper = 4

[models.markov_renewal.c_t]
lower = 0.5
upper = 1.5

[models.mmpp]
crossover_probability = 0.45
mutation_probability = 0.0
mutation_scale = 0.08

[models.mmpp.q01]
lower = 0.2
upper = 2.0

[models.mmpp.q10]
lower = 0.2
upper = 2.0

[models.mmpp.lambda0]
lower = 0.5
upper = 3.0

[models.mmpp.lambda1]
lower = 3.0
upper = 8.0

[models.nhpp]
crossover_probability = 0.6
mutation_probability = 0.0
mutation_scale = 0.09

[models.nhpp.bin_count]
lower = 2
upper = 4

[models.acd]
crossover_probability = 0.55
mutation_probability = 0.0
mutation_scale = 0.08

[models.acd.order]
lower = 1
upper = 2

[models.markov_packet_train]
crossover_probability = 0.65
mutation_probability = 0.0
mutation_scale = 0.09

[models.markov_packet_train.length_cap]
lower = 3
upper = 5

[models.packet_hmm]
crossover_probability = 0.7
mutation_probability = 0.0
mutation_scale = 0.08

[models.packet_hmm.state_count]
lower = 2
upper = 3

[similarity]
iat_diagnostic_quantile = 0.75
acf_lags = [
    1,
]
acf_lag_weights = [
    1.0,
]
acf_iat_weight = 0.5
acf_size_weight = 0.5
multiscale_widths_seconds = [
    1.0,
    2.5,
]
multiscale_scale_weights = [
    0.5,
    0.5,
]
multiscale_packet_weight = 0.5
multiscale_byte_weight = 0.5
max_direction_bin_cells = 100
cvm_iat_weight = 0.5
cvm_size_weight = 0.5
cvm_global_weight = 0.5
cvm_uplink_weight = 0.25
cvm_downlink_weight = 0.25
ad_iat_weight = 0.5
ad_size_weight = 0.5
ad_global_weight = 0.5
ad_uplink_weight = 0.25
ad_downlink_weight = 0.25
js_iat_bin_count = 8
js_iat_weight = 0.5
js_mark_weight = 0.5
mmd_feature_count = 32
mmd_seed = 17
mmd_scale_floor = 0.001

[similarity.method_weights]
frame_size_ks = 0.125
iat_ks = 0.125
autocorrelation = 0.125
multiscale_rate = 0.125
cramer_von_mises = 0.125
anderson_darling = 0.125
jensen_shannon = 0.125
approximate_mmd = 0.125

[similarity.postfit.dispersion]
widths_seconds = [
    1.0,
    2.5,
]
scale_weights = [
    0.5,
    0.5,
]
fano_weight = 0.5
allan_weight = 0.5

[similarity.postfit.transition]
size_bin_count = 2
iat_bin_count = 2
pseudocount = 0.5
occupancy_weight = 0.34
transition_rows_weight = 0.33
runs_weight = 0.33

[similarity.postfit.c2st]
feature_version = "window-v1"
window_width_seconds = 1.0
fold_count = 2
guard_window_count = 1
maximum_window_count = 64
l2_regularization = 1.0
maximum_iterations = 100
tolerance = 1e-09
